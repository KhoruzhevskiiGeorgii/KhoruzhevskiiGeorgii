name: Polymarket closed-position recovery 2026-07-28

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover rate-limited closed positions
        run: python recover_closed.py | tee recovery.log
      - name: Upload recovery output
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-closed-recovery
          path: |
            recovery_output/
            recovery.log
          if-no-files-found: error
          retention-days: 1
