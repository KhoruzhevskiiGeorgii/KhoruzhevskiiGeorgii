name: Polymarket scan 2026-07-28

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run bounded-time one-off scan
        run: python polymarket_scan_fast_wrapper.py | tee scan.log

      - name: Upload scan output
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-scan-results
          path: |
            output/
            scan.log
          if-no-files-found: error
          retention-days: 1
