name: Polymarket price-persistence recovery 2026-07-28

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover corrected price histories
        run: python recover_prices.py | tee price_recovery.log
      - name: Upload price-recovery output
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-price-recovery
          path: |
            price_recovery_output/
            price_recovery.log
          if-no-files-found: error
          retention-days: 1
